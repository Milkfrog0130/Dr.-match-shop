<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dr.Matcha SHOP | 專業抹茶選品</title>
    <style>
        :root {
            --matcha-dark: #4A5D23;
            --matcha-green: #89A053;
            --cream: #F9F8F1;
            --text-color: #333;
        }

        body {
            font-family: "Helvetica Neue", Helvetica, Arial, "PingFang TC", "Heiti TC", "Microsoft JhengHei", sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--cream);
            color: var(--text-color);
            line-height: 1.6;
        }

        header {
            background-color: var(--matcha-dark);
            color: white;
            text-align: center;
            padding: 60px 20px;
        }

        header h1 {
            margin: 0;
            font-size: 2.5em;
            letter-spacing: 2px;
        }

        header p {
            font-weight: 300;
            margin-top: 10px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .photo-card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: transform 0.3s ease;
        }

        .photo-card:hover {
            transform: translateY(-5px);
        }

        .photo-card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            display: block;
        }

        .info-section {
            background-color: white;
            padding: 40px;
            border-radius: 8px;
            margin-top: 40px;
            border-left: 5px solid var(--matcha-green);
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        h2 {
            color: var(--matcha-dark);
            border-bottom: 2px solid var(--matcha-green);
            display: inline-block;
            padding-bottom: 5px;
        }

        footer {
            text-align: center;
            padding: 40px;
            font-size: 0.9em;
            color: #777;
        }

        .btn-link {
            display: inline-block;
            background: var(--matcha-green);
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 10px;
        }

        @media (max-width: 600px) {
            .info-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<header>
    <h1>Dr.Matcha SHOP</h1>
    <p>專業抹茶職人精神，品味最純正的綠意韻味</p>
</header>

<div class="container">
    <section>
        <h2>精選映像</h2>
        <div class="gallery">
            <div class="photo-card">
                <img src="https://via.placeholder.com/400x300?text=Shop+Image+1" alt="店面形象照片">
            </div>
            <div class="photo-card">
                <img src="https://via.placeholder.com/400x300?text=Shop+Image+2" alt="產品特寫照片">
            </div>
            <div class="photo-card">
                <img src="https://via.placeholder.com/400x300?text=Shop+Image+3" alt="店內環境照片">
            </div>
        </div>
    </section>

    <div class="info-section">
        <div class="info-grid">
            <div>
                <h2>關於我們</h2>
                <p>位於台北大安區巷弄內的抹茶專賣空間。我們秉持著對於抹茶品質的極致追求，為您帶來最道地的日式抹茶饗宴。</p>
                <a href="https://www.facebook.com/doctormatcha/" class="btn-link" target="_blank">造訪 Facebook 專頁</a>
            </div>
            <div>
                <h2>營業資訊</h2>
                <p><strong>地址：</strong> 台北市大安區光復南路420巷9號</p>
                <p><strong>電話：</strong> 02 2702 3883</p>
                <p><strong>營業時間：</strong><br>
                週一至週六：10:00 – 17:00<br>
                週日：公休</p>
            </div>
        </div>
    </div>
</div>

<footer>
    &copy; 2026 Dr.Matcha SHOP. 版權所有。
</footer>

</body>
</html>
